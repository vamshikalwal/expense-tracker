spring.application.name=Expense-Tracker
#jwt.secret=expense-tracker-development-secret-key-please-change
#jwt.expiration=86400000


# Server Configuration
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging
logging.level.root=INFO
logging.level.com.expenseTracker=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# JPA configuration
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=mySecretKeyForExpenseTrackerApplicationPleaseChangeThisInProductionEnvironmentVeryImportant123456
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:3001
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Keep schema generation in Hibernate and do not auto-run seed scripts on every restart.
# The project uses MySQL and data.sql inserts fixed IDs, which causes duplicate PK errors
# when the app boots repeatedly.
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
